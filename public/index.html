<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeM 建群测试台</title>
<style>
  :root { --brand: #3370ff; --ok: #34c724; --err: #f54a45; --bg: #f5f6f7; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); margin: 0; color: #1f2329; }
  .wrap { max-width: 680px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #646a73; margin: 14px 0 6px; }
  input[type=text], textarea { width: 100%; padding: 8px 10px; border: 1px solid #dee0e3; border-radius: 8px; font-size: 14px; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { min-height: 60px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  button { background: var(--brand); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .hint { font-size: 12px; color: #8f959e; margin-top: 4px; }
  .bot-item { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .bot-item input { flex: 1; }
  .bot-item .del { color: var(--err); cursor: pointer; font-size: 18px; border: none; background: none; padding: 0 4px; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 14px; }
  #result { font-size: 14px; line-height: 1.7; word-break: break-all; }
  #result.ok { color: var(--ok); } #result.err { color: var(--err); }
  pre { background: #f2f3f5; padding: 10px; border-radius: 8px; font-size: 12px; overflow: auto; }
  a { color: var(--brand); }
  .tag { display: inline-block; background: #eef3ff; color: var(--brand); border-radius: 4px; padding: 1px 8px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CodeM 建群测试台 <span class="tag">webhook 前端</span></h1>

  <div class="card">
    <label>群名称 *</label>
    <input type="text" id="name" placeholder="例如：XX 需求讨论组（≤60 字）" />
    <div class="hint">由本次请求动态传入</div>

    <label>群描述（可选）</label>
    <input type="text" id="desc" placeholder="≤100 字" />

    <label>群成员（可选，每行一个：姓名 / 邮箱 / open_id）</label>
    <textarea id="members" placeholder="张三&#10;lisi@corp.com&#10;ou_xxxxxxxx"></textarea>
    <div class="hint">姓名会自动解析为 open_id；解析失败会列在结果里，可改传 open_id</div>

    <div class="switch">
      <input type="checkbox" id="include_me" checked />
      <label for="include_me" style="margin:0">把服务部署者（我）拉进群</label>
    </div>

    <label>拉取的机器人（可勾选，app_id 需 cli_ 开头；不勾选则不拉取）</label>
    <div id="bots"></div>
    <div class="row">
      <button class="ghost" type="button" onclick="addBot('')">+ 添加其他机器人</button>
    </div>
    <div class="hint">CodeM 机器人默认勾选，可自行取消；额外行填入其他机器人的 app_id 可同时拉取，单群最多 5 个机器人</div>

    <div class="row">
      <button id="submit" onclick="submitForm()">创建群聊</button>
      <span id="submitting" style="font-size:13px;color:#8f959e"></span>
    </div>
  </div>

  <div class="card" id="pendingBanner" style="display:none">
    <div id="pendingInfo" style="font-size:14px;line-height:1.7"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div id="result"></div>
    <pre id="raw" style="display:none"></pre>
  </div>
</div>

<script>
const CODEM_BOT_APP_ID = 'cli_aac5d4db58385cd3';

function addBot(value, locked) {
  const box = document.getElementById('bots');
  const div = document.createElement('div');
  div.className = 'bot-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = true;
  const input = document.createElement('input');
  input.type = 'text'; input.value = value; input.disabled = !!locked;
  input.placeholder = 'cli_xxxxxxxxxxxx';
  const label = document.createElement('span');
  label.style.fontSize = '13px'; label.style.color = '#646a73';
  label.textContent = value ? (locked ? '（CodeM 机器人，可取消勾选）' : '') : '（其他机器人）';
  div.appendChild(cb); div.appendChild(input); div.appendChild(label);
  if (!locked) {
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '移除';
    del.onclick = () => div.remove();
    div.appendChild(del);
  }
  box.appendChild(div);
}
addBot(CODEM_BOT_APP_ID, true); // CodeM 机器人默认勾选，可取消

// 加载 Meego 草稿：URL 带 ?pending=<id> 时预填工作项信息
(async function loadPending() {
  const m = new URLSearchParams(location.search).get('pending');
  if (!m) return;
  try {
    const res = await fetch(`/api/pending/${encodeURIComponent(m)}`);
    const data = await res.json();
    if (!data.ok) { alert('草稿不存在或已过期：' + (data.error || '')); return; }
    const p = data.pending;
    document.getElementById('name').value = p.name || '';
    document.getElementById('desc').value = p.description || '';
    const banner = document.getElementById('pendingBanner');
    const info = document.getElementById('pendingInfo');
    banner.style.display = '';
    const wi = p.work_item || {};
    info.innerHTML = `<b>来自 Meego 工作项变更事件</b><br>工作项：${wi.type || ''} <a href="https://project.feishu.cn/workitem?item_id=${wi.id}" target="_blank">#${wi.id}</a>「${wi.name || ''}」${wi.project ? `（空间：${wi.project}）` : ''}` +
      `<br>群名已预填（含工作项 id，可修改），请确认成员与机器人后点击「创建群聊」`;
  } catch (e) { console.warn('load pending failed', e); }
})();

async function submitForm() {
  const name = document.getElementById('name').value.trim();
  const result = document.getElementById('result');
  const card = document.getElementById('resultCard');
  const raw = document.getElementById('raw');
  const btn = document.getElementById('submit');
  if (!name) { card.style.display = ''; result.className = 'err'; result.textContent = '请填写群名称'; return; }

  const members = document.getElementById('members').value
    .split(/\n+/).map(s => s.trim()).filter(Boolean);
  const bots = [...document.querySelectorAll('#bots .bot-item')]
    .filter(row => row.querySelector('input[type=checkbox]').checked)
    .map(row => row.querySelector('input[type=text]').value.trim())
    .filter(v => /^cli_[0-9a-z]+$/i.test(v));
  const invalidBots = [...document.querySelectorAll('#bots input')]
    .map(i => i.value.trim()).filter(v => v && !/^cli_[0-9a-z]+$/i.test(v));

  const body = {
    name,
    description: document.getElementById('desc').value.trim() || undefined,
    members,
    include_me: document.getElementById('include_me').checked,
    bots,
  };

  btn.disabled = true;
  document.getElementById('submitting').textContent = '创建中…';
  try {
    const res = await fetch('/webhook/group', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    card.style.display = '';
    if (data.ok) {
      result.className = 'ok';
      result.innerHTML = `✅ 群「${data.chat_name}」创建成功` +
        (data.link ? `<br>打开群聊：<a href="${data.link}" target="_blank">${data.link}</a>` : '') +
        `<br>已拉成员数：${data.members_added}；机器人：${(data.bots_invited || []).join('、')}` +
        ((data.unresolved_members || []).length
          ? `<br>⚠️ 以下成员未解析成功：${data.unresolved_members.map(m => `${m.member}（${m.reason}）`).join('、')}，可改传 open_id 重试`
          : '');
    } else {
      result.className = 'err';
      result.textContent = '❌ 创建失败：' + (data.error || JSON.stringify(data));
    }
    raw.style.display = ''; raw.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    card.style.display = '';
    result.className = 'err';
    result.textContent = '❌ 请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    document.getElementById('submitting').textContent = '';
  }
}
</script>
</body>
</html>
